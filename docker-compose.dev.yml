services:
  backend-dev:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dailykyi-backend-dev
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - DAILYKYI_DATABASE_URL=${DAILYKYI_DATABASE_URL:-sqlite+aiosqlite:///data/dailykyi.db}
      - DAILYKYI_DEBUG=True
      - DAILYKYI_LOG_LEVEL=${DAILYKYI_LOG_LEVEL:-DEBUG}
      # 容器时区设为香港时间，否则 datetime.now() 返回 UTC，日志时间晚 8 小时
      - TZ=Asia/Hong_Kong
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - dailykyi-dev-net

  frontend-dev:
    image: node:20-alpine
    container_name: dailykyi-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      # 面板入口统一 23333（与生产部署一致），容器内 Vite 仍跑 3000
      - "23333:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
      - VITE_API_PROXY=http://backend-dev:8000
    networks:
      - dailykyi-dev-net

networks:
  dailykyi-dev-net:
    driver: bridge
